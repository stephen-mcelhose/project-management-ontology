# Eval case: project-proposal
# Drives the agent through the full project-proposal gate sequence.
# Run with: pytest -m eval --run-evals agent/evals/

id: project-proposal-full-walk
description: >
  Verify the agent walks all required gates for the project-proposal document,
  writes the output Markdown, and the content reflects the user's answers.

phase: initiation
document: project-proposal

# User turns to feed the agent in order
turns:
  - user: "Let's start. I want to create a Project Proposal."
  - user: "The project name is Platform Modernisation."
  - user: >
      The problem is that our core data platform runs on a 10-year-old
      batch ETL framework that cannot support near-real-time analytics.
  - user: >
      Objectives: (1) Replace batch ETL with streaming pipeline.
      (2) Reduce data latency from 24h to <15min. (3) Enable self-serve BI.
  - user: "Expected benefits: eliminate 2 analyst-days/month of data reconciliation, reduce exec reporting lag from 7 days to same-day, and free ~8 analyst-hours/week currently spent on manual PDF distribution."
  - user: "In scope: data ingestion, transformation, and serving layers."
  - user: "Out of scope: frontend dashboards, ML feature store."
  - user: "Sponsor is Jane Smith, Head of Data Engineering."
  - user: "Key stakeholders: Data team, Analytics team, Finance."
  - user: "Rough budget: €200–400k."
  - user: "Timeline: 12 months, starting Q2 2026."
  - user: >
      Risks: (1) If vendor SLA is missed, timeline slips.
      (2) If headcount not approved, scope must be reduced.
  - user: "We request approval to proceed to a Business Case."

# Assertions on recorded gate state (deterministic in scripted mode).
# If any of these fail the capture broke — check before blaming the template.
expect_gate_answers:
  project_name: "Platform Modernisation"
  problem_statement: "Our core data platform runs on a 10-year-old batch ETL framework that cannot support near-real-time analytics."
  objectives: "(1) Replace batch ETL with streaming pipeline. (2) Reduce data latency from 24h to <15min. (3) Enable self-serve BI."
  expected_benefits: "eliminate 2 analyst-days/month of data reconciliation, reduce exec reporting lag from 7 days to same-day, and free ~8 analyst-hours/week currently spent on manual PDF distribution."
  scope_in: "Data ingestion, transformation, and serving layers."
  scope_out: "Frontend dashboards, ML feature store."
  sponsor: "Jane Smith, Head of Data Engineering."
  stakeholders: "Data team, Analytics team, Finance."
  rough_budget: "€200–400k."
  rough_timeline: "12 months, starting Q2 2026."
  risks_assumptions: "(1) If vendor SLA is missed, timeline slips. (2) If headcount not approved, scope must be reduced."
  authorization_request: "We request approval to proceed to a Business Case."

# Assertions on the written document
expect_document_written: true
expect_content_contains:
  - "Platform Modernisation"
  - "batch ETL"
  - "Jane Smith"
  - "€200"

# Assertions on tool call sequence (ordered, may have interleaved text turns)
expect_tool_calls:
  - get_next_gate
  - record_answer
  - get_next_gate
  - record_answer
  - write_document
  - validate_document

# Scripted model responses — one entry per model invocation.
# Maps each user turn to deterministic tool calls + text so this case
# runs in CI without a live model. Ignored when --run-evals is set.
scripted_responses:
  # Turn 1: "Let's start. I want to create a Project Proposal."
  - tool_call: {name: get_progress, args: {}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "What is the project name?"

  # Turn 2: "The project name is Platform Modernisation."
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: project_name, answer: "Platform Modernisation"}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "What problem or opportunity is this project addressing?"

  # Turn 3: problem statement
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: problem_statement, answer: "Our core data platform runs on a 10-year-old batch ETL framework that cannot support near-real-time analytics."}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "What are the project objectives?"

  # Turn 4: objectives
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: objectives, answer: "(1) Replace batch ETL with streaming pipeline. (2) Reduce data latency from 24h to <15min. (3) Enable self-serve BI."}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "What are the expected benefits?"

  # Turn 5: expected_benefits
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: expected_benefits, answer: "eliminate 2 analyst-days/month of data reconciliation, reduce exec reporting lag from 7 days to same-day, and free ~8 analyst-hours/week currently spent on manual PDF distribution."}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "What is in scope?"

  # Turn 6: scope_in
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: scope_in, answer: "Data ingestion, transformation, and serving layers."}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "What is out of scope?"

  # Turn 7: scope_out
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: scope_out, answer: "Frontend dashboards, ML feature store."}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "Who is the proposed sponsor?"

  # Turn 8: sponsor
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: sponsor, answer: "Jane Smith, Head of Data Engineering."}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "Who are the key stakeholders?"

  # Turn 9: stakeholders
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: stakeholders, answer: "Data team, Analytics team, Finance."}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "What is the rough budget estimate?"

  # Turn 10: rough_budget (optional — agent now asks for it; user answers)
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: rough_budget, answer: "€200–400k."}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "What is the rough timeline?"

  # Turn 11: rough_timeline (optional — agent now asks for it; user answers)
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: rough_timeline, answer: "12 months, starting Q2 2026."}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "What are the key risks and assumptions?"

  # Turn 12: risks_assumptions
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: risks_assumptions, answer: "(1) If vendor SLA is missed, timeline slips. (2) If headcount not approved, scope must be reduced."}}
  - tool_call: {name: get_next_gate, args: {document_id: project-proposal}}
  - text: "What authorization are you requesting?"

  # Turn 13: authorization_request → write → validate
  - tool_call: {name: record_answer, args: {document_id: project-proposal, gate_id: authorization_request, answer: "We request approval to proceed to a Business Case."}}
  - tool_call: {name: write_document, args: {document_id: project-proposal}}
  - tool_call: {name: validate_document, args: {document_id: project-proposal}}
  - text: "Your Project Proposal is complete and has been validated."
