id: project-charter
title: Project Charter
phase: initiation
phase_order: 3         # third document produced in a project lifecycle

ontology_class: https://stephen-mcelhose.github.io/process-assistant/pm/ProjectCharter

# Grounding
standard:
  name: ISO 21502:2020 — Guidance on project management
  url: https://www.iso.org/standard/74947.html
din_69901:
  phase: Initiation
  part: DIN 69901-2:2009
  url: https://www.beuth.de/en/standard/din-69901-2/119948897
prince2_equivalent:
  name: Project Initiation Documentation (PID)
  url: https://prince2.wiki/management-products/baselines/project-initiation-documentation/
package: pkgs:InitiationPackage

# Dependency chain (pm:hasHardDependency)
dependencies:
  - business-case            # Project Charter formally authorizes the project justified by the Business Case
required_before:
  - stakeholder-register       # this document is a hard dependency for Stakeholder Register

# Template files
template: template.md
instructions: instructions.yaml
shacl_shape: ../../../shapes/initiation/project-charter.shacl.ttl
