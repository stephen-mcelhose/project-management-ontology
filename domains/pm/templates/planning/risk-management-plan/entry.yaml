id: risk-management-plan
title: Risk Management Plan
phase: planning
phase_order: 6         # defines how risks are managed throughout the project

ontology_class: https://stephen-mcelhose.github.io/process-assistant/pm/RiskManagementPlan

# Grounding
standard:
  name: ISO 21502:2020 — Guidance on project management
  url: https://www.iso.org/standard/74947.html
prince2_equivalent:
  name: Risk Management Approach
  url: https://prince2.wiki/management-products/baselines/management-approaches/risk/
package: pkgs:PlanningPackage

# Dependency chain (pm:hasHardDependency)
dependencies:
  - project-charter          # must exist before the Risk Management Plan can be produced
required_before:
  - risk-register            # RiskRegister depends on RiskManagementPlan

# Template files
template: template.md
instructions: instructions.yaml
shacl_shape: ../../../shapes/planning/risk-management-plan.shacl.ttl
