id: project-closure-statement
title: Project Closure Statement
phase: closure
phase_order: 5         # fifth document produced in the closure phase

ontology_class: https://stephen-mcelhose.github.io/process-assistant/pm/ProjectClosureStatement

# Grounding
standard:
  name: ISO 21502:2020 — Guidance on project management
  url: https://www.iso.org/standard/74947.html
prince2_equivalent:
  name: End Project Report (Project Board acceptance)
  url: https://prince2.wiki/management-products/reports/end-project-report/
package: pkgs:ClosurePackage

# Scope note: In PRINCE2, the Project Board formally authorises closure as part of the
# Closing a Project process. A standalone Project Closure Statement is the ISO 21502 /
# DIN 69901 practice and provides an explicit, signable record of project closure.

# Dependency chain (pm:hasHardDependency)
dependencies:
  - final-project-report   # closure statement follows the Final Project Report
required_before: []         # terminal — this is the final document in the closure phase

# Template files
template: template.md
instructions: instructions.yaml
shacl_shape: ../../../shapes/closure/project-closure-statement.shacl.ttl
