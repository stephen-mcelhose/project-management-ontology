id: archive-index
title: Archive Index
phase: closure
phase_order: 4         # fourth document produced in the closure phase

ontology_class: https://stephen-mcelhose.github.io/process-assistant/pm/ArchiveIndex

# Grounding
standard:
  name: ISO 21502:2020 — Guidance on project management
  url: https://www.iso.org/standard/74947.html
prince2_equivalent:
  name: Product Register (broader)
  url: https://prince2.wiki/management-products/project-log/product-register/
package: pkgs:ClosurePackage

# Scope note: The all-documents dependency for the Archive Index is expressed
# narratively rather than as enumerated triples — the index implicitly depends on
# all project documents existing before it can be compiled.

# Dependency chain (pm:hasHardDependency)
dependencies:
  - final-project-report   # the Final Project Report must be complete before archiving
required_before: []         # terminal — no further closure documents depend on this

# Template files
template: template.md
instructions: instructions.yaml
shacl_shape: ../../../shapes/closure/archive-index.shacl.ttl
