# instructions.yaml — Handover Document
#
# Rules for an agent helping a project manager fill out a Handover Document.
# Each gate is a question or check the agent must complete before moving on.
# Gates are ordered: earlier gates must be resolved before later ones.
#
# ISO 21502:2020 basis: Section 9 — Closing a project
# The Handover Document formalises the transfer of project deliverables to the
# recipient organisation (operations, maintenance, or client).
#
# PRINCE2 note: In PRINCE2 this content appears inside the End Project Report.
# A standalone Handover Document is the ISO 21502 / DIN 69901 practice.
#
# This is the INPUT side. The output is validated by:
#   domains/pm/shapes/closure/handover-document.shacl.ttl

version: 1
document: handover-document

gates:
  - id: project_summary
    order: 1
    type: prose
    prompt: "Provide a brief summary of the project: its name, purpose, and the deliverables being handed over."
    fills: "## Project Summary"
    maps_to: dct:description
    required: true
    validation: "Must include the project name and at least one named deliverable."

  - id: deliverables_handover
    order: 2
    type: section
    prompt: "List each deliverable being handed over. For each, state: the deliverable name, its status at handover (complete / conditionally accepted / deferred), and the receiving party."
    fills: "## Deliverables Handover"
    maps_to: pm:hasDeliverable
    required: true
    validation: "Every deliverable must have a status. Conditional acceptances must note the outstanding condition."
    guidance: "Reference the Deliverable Status Report to confirm each item's status. Only deliverables marked 'complete' or 'conditionally accepted' may appear here."

  - id: operational_responsibilities
    order: 3
    type: section
    prompt: "Who assumes operational responsibility for each handover item? Name the individual or team and their role."
    fills: "## Operational Responsibilities"
    maps_to: dct:contributor
    required: true
    guidance: "Distinguish between the party receiving the deliverable (operational owner) and any third-party support provider."

  - id: outstanding_items
    order: 4
    type: section
    prompt: "Are there any outstanding items, known defects, or deferred scope elements? List each with an agreed resolution date and responsible owner, or state 'None'."
    fills: "## Outstanding Items"
    maps_to: dct:description
    required: true
    guidance: "Be explicit. Omitting known defects at handover creates operational risk and liability for the project. State 'None' only if genuinely nothing is outstanding."

  - id: support_arrangements
    order: 5
    type: prose
    prompt: "What support, warranty, or maintenance arrangements are in place after handover? State duration, scope, and contact point."
    fills: "## Support Arrangements"
    maps_to: dct:description
    required: false
    deferred_value: "*Deferred — to be confirmed before phase completion.*"
    guidance: "If no formal support arrangement applies, state 'No post-handover support agreed' rather than leaving this blank."

  - id: handover_acceptance
    order: 6
    type: prose
    prompt: "Who formally accepts this handover, and on what date? Record the name, role, and organisation of the accepting party."
    fills: "## Handover Acceptance"
    maps_to: pm:approvedBy
    required: true
    guidance: "Handover is not complete until formally accepted. An unsigned handover document has no standing — get sign-off before the project is closed."

# Completion rule: all required gates must be filled before the document
# is considered draft-complete. The agent MUST NOT mark the document complete
# if any required gate is empty or contains only a placeholder.
completion:
  required_gates:
    - project_summary
    - deliverables_handover
    - operational_responsibilities
    - outstanding_items
    - handover_acceptance
  output_status: draft
  next_document: final-project-report
