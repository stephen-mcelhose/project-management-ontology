id: deliverable-status-report
title: Deliverable Status Report
phase: execution
phase_order: 2         # produced periodically by teams during work package execution

ontology_class: https://stephen-mcelhose.github.io/process-assistant/pm/DeliverableStatusReport

# Grounding
standard:
  name: ISO 21502:2020 — Guidance on project management
  url: https://www.iso.org/standard/74947.html
prince2_equivalent:
  name: Checkpoint Report
  url: https://prince2.wiki/management-products/reports/checkpoint-report/
package: pkgs:ExecutionPackage

# Dependency chain (pm:hasHardDependency)
dependencies:
  - project-schedule            # schedule provides the plan baseline this report compares against
required_before:
  - handover-document           # handover requires confirmed deliverable completion status

# Template files
template: template.md
instructions: instructions.yaml
shacl_shape: ../../../shapes/execution/deliverable-status-report.shacl.ttl
