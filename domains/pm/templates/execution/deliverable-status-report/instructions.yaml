# instructions.yaml — Deliverable Status Report
#
# Rules for an agent helping a user fill out the Deliverable Status Report template.
# Each gate is a question or check the agent must complete before moving on.
# Gates are ordered: earlier gates must be resolved before later ones.
#
# This is the INPUT side. The output is validated by:
#   domains/pm/shapes/execution/deliverable-status-report.shacl.ttl

version: 1
document: deliverable-status-report

gates:
  - id: work_package_reference
    order: 1
    type: string
    prompt: "Which Work Package does this report cover? Provide the Work Package ID and title (e.g. WP-003 — Backend API Integration)."
    fills: "# Deliverable Status Report: {{work_package_reference}}"
    maps_to: dct:title
    required: true
    validation: "Must reference a valid Work Package ID from the project's Work Breakdown Structure."

  - id: report_date
    order: 2
    type: date
    prompt: "What is the date of this Deliverable Status Report?"
    fills: "## Report Date"
    maps_to: dct:created
    required: true
    validation: "Must be a specific date. Reports must be issued at the frequency agreed in the Work Package Description."

  - id: reporting_period
    order: 3
    type: prose
    prompt: "What reporting period does this report cover? State the start date and end date of the period."
    fills: "## Reporting Period"
    maps_to: dct:description
    required: true
    validation: "Period dates must align with the reporting schedule agreed in the Work Package Description."

  - id: deliverables_completed
    order: 4
    type: section
    prompt: "Which deliverables were completed and accepted in this reporting period? For each, state: deliverable name, ID, completion date, and confirmation of acceptance."
    fills: "## Deliverables Completed This Period"
    maps_to: pm:hasDeliverable
    required: true
    guidance: "If no deliverables were completed, state 'None completed this period' — do not leave blank. Completed means formally accepted, not just finished by the team."

  - id: deliverables_in_progress
    order: 5
    type: section
    prompt: "Which deliverables are currently in progress? For each, state: deliverable name, current status, percentage complete, and any issues affecting completion."
    fills: "## Deliverables In Progress"
    maps_to: pm:hasDeliverable
    required: true
    guidance: "Use the DeliverableStatus vocabulary: Draft, In Review, Approved, Released. 'In progress' alone is insufficient — report the actual status stage."

  - id: deliverables_planned_next_period
    order: 6
    type: section
    prompt: "What deliverables or significant work activities are planned for the next reporting period? State expected completion dates."
    fills: "## Planned Next Period"
    maps_to: pm:hasDeliverable
    required: true

  - id: comparison_to_plan
    order: 7
    type: prose
    prompt: "How does actual progress compare to the Team Plan for this period? Note any deviations from the planned schedule and explain the cause."
    fills: "## Comparison to Plan"
    maps_to: dct:description
    required: true
    validation: "Must address both schedule and scope. A deviation must include its cause — not just 'we are behind schedule'."

  - id: issues_and_risks
    order: 8
    type: section
    prompt: "Are there any issues or risks that need the Project Manager's attention? For each, state: description, potential impact on tolerances, and proposed response."
    fills: "## Issues and Risks"
    maps_to: pm:hasRisk
    required: true
    guidance: "If none, state 'No issues or risks to escalate this period.' Include anything that could cause a tolerance breach before the next report."

  - id: open_actions
    order: 9
    type: section
    prompt: "List any open actions from previous Deliverable Status Reports that are still outstanding. For each, state the action, assigned owner, original due date, and current status."
    fills: "## Open Actions from Previous Reports"
    maps_to: dct:description
    required: true
    guidance: "If this is the first report, state 'No prior actions — first report for this Work Package.' Never leave this section blank."

# Completion rule: all required gates must be filled before the document
# is considered draft-complete.
completion:
  required_gates:
    - work_package_reference
    - report_date
    - reporting_period
    - deliverables_completed
    - deliverables_in_progress
    - deliverables_planned_next_period
    - comparison_to_plan
    - issues_and_risks
    - open_actions
  output_status: draft
  next_document: change-request
