id: final-project-report
title: Final Project Report
phase: closure
phase_order: 2         # second document produced in the closure phase

ontology_class: https://stephen-mcelhose.github.io/project-management-ontology/FinalProjectReport

# Grounding
standard:
  name: ISO 21502:2020 — Guidance on project management
  url: https://www.iso.org/standard/74947.html
prince2_equivalent:
  name: End Project Report
  url: https://prince2.wiki/management-products/reports/end-project-report/
package: pkgs:ClosurePackage

# Dependency chain (pm:hasHardDependency)
dependencies:
  - status-report               # cross-phase: from Monitoring & Control
  - handover-document           # closure phase: handover must be complete
required_before:
  - archive-index               # ArchiveIndex depends on FinalProjectReport
  - project-closure-statement   # ProjectClosureStatement depends on FinalProjectReport

# Template files
template: template.md
instructions: instructions.yaml
shacl_shape: ../../../shapes/closure/final-project-report.shacl.ttl
