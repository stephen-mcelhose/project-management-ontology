# instructions.yaml — Final Project Report
#
# Rules for an agent helping a project manager fill out a Final Project Report.
# Each gate is a question or check the agent must complete before moving on.
# Gates are ordered: earlier gates must be resolved before later ones.
#
# PRINCE2 basis: End Project Report
# The End Project Report is produced by the Project Manager and reviewed by
# the Project Board at the end of the project. It confirms:
#   1. Whether the project delivered what was agreed
#   2. How it performed against the approved plan
#   3. Whether the Business Case remains valid
#   4. Key lessons to carry forward
#
# This is the INPUT side. The output is validated by:
#   shapes/closure/final-project-report.shacl.ttl

version: 1
document: final-project-report

gates:
  - id: project_summary
    order: 1
    type: prose
    prompt: "Provide a brief summary of the project: its name, purpose, approved start and end dates, and actual start and end dates."
    fills: "## Project Summary"
    maps_to: dct:description
    required: true
    validation: "Must include the project name and both planned and actual dates."

  - id: achievement_of_objectives
    order: 2
    type: section
    prompt: "Were the project's objectives met? For each objective stated in the Project Charter, confirm whether it was fully met, partially met, or not met — and explain why."
    fills: "## Achievement of Objectives"
    maps_to: pm:hasObjective
    required: true
    guidance: "Reference the Project Charter for the original objective statements. Partial achievement must be explained — not glossed over. This section is the primary record of what the project delivered."

  - id: performance_against_plan
    order: 3
    type: section
    prompt: "How did the project perform against the approved plan across each of the six tolerance areas: time, cost, quality, scope, benefits, and risk? State approved baseline vs. actual for time and cost."
    fills: "## Performance Against Plan"
    maps_to: pm:hasTolerance
    required: true
    guidance: "Use the Status Report history as your source. Avoid narrative spin — state variances clearly and explain the reasons. Positive variances (under budget, ahead of schedule) also need explanation."

  - id: business_case_review
    order: 4
    type: prose
    prompt: "Was the Business Case achieved? State whether the expected benefits remain on track to be realized. If benefits are post-project, note the planned review date."
    fills: "## Business Case Review"
    maps_to: dct:description
    required: true
    guidance: "In PRINCE2, benefits that cannot yet be measured are recorded with a planned Benefits Review date. Do not claim benefits that have not been confirmed."

  - id: lessons_summary
    order: 5
    type: list
    prompt: "What are the top three to five lessons from this project? These will be expanded in the Lessons Learned Report — here provide a brief headline for each."
    fills: "## Lessons Summary"
    maps_to: dct:description
    required: true
    guidance: "A lessons summary with no lessons is not a summary — it is an omission. Every project has lessons. Focus on lessons that would change behaviour on the next project."

  - id: outstanding_actions
    order: 6
    type: section
    prompt: "Are there any actions or recommendations that remain open at project closure? List each with an agreed owner and target date, or state 'No outstanding actions'."
    fills: "## Outstanding Actions"
    maps_to: dct:description
    required: true
    guidance: "Outstanding actions must be formally handed over to a named owner. They cannot be left unassigned."

  - id: recommendations
    order: 7
    type: section
    prompt: "What recommendations does the Project Manager make to the Project Board, sponsor, or operational owner? Include any advice on follow-on projects or benefits realisation."
    fills: "## Recommendations"
    maps_to: dct:description
    required: false
    deferred_value: "*Deferred — to be confirmed before phase completion.*"
    guidance: "Recommendations are the Project Manager's expert view. They are advisory — the Project Board decides whether to act on them."

# Completion rule: all required gates must be filled before the document
# is considered draft-complete. The agent MUST NOT mark the document complete
# if any required gate is empty or contains only a placeholder.
completion:
  required_gates:
    - project_summary
    - achievement_of_objectives
    - performance_against_plan
    - business_case_review
    - lessons_summary
    - outstanding_actions
  output_status: draft
  next_document: null
