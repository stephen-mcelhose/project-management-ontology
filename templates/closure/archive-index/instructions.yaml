# instructions.yaml — Archive Index
#
# Rules for an agent helping a project manager fill out an Archive Index.
# Each gate is a question or check the agent must complete before moving on.
# Gates are ordered: earlier gates must be resolved before later ones.
#
# ISO 21502:2020 basis: Section 9 — Closing a project
# The Archive Index ensures that all project records are identified, stored,
# and accessible for future reference, audit, or benefits realisation review.
#
# PRINCE2 note: The Archive Index is broader than the PRINCE2 Product Register.
# It covers all project management records (logs, plans, reports, contracts)
# in addition to the product/deliverable inventory.
#
# Note: The all-documents dependency is expressed narratively — the index
# implicitly depends on all project documents being complete before archiving.
#
# This is the INPUT side. The output is validated by:
#   shapes/closure/archive-index.shacl.ttl

version: 1
document: archive-index

gates:
  - id: archive_location
    order: 1
    prompt: "Where will the project archive be stored? State the system or location name (e.g. SharePoint site URL, shared drive path, document management system reference) and the archive owner."
    fills: "## Archive Location"
    maps_to: dct:description
    required: true
    validation: "Must specify a concrete storage location and a named archive owner."

  - id: document_inventory
    order: 2
    prompt: "List all documents that form part of the project archive. For each document, state: document name, document type (plan / report / log / contract / etc.), version, and date finalized."
    fills: "## Document Inventory"
    maps_to: dct:hasPart
    required: true
    validation: "Every document must have a name and a type. Version and date are required for all finalized documents."
    guidance: "Include all six phases: Initiation, Planning, Execution, Monitoring & Control, and Closure. The archive is not complete if any phase is unrepresented."

  - id: access_controls
    order: 3
    prompt: "Who may access the project archive, and under what conditions? State which roles have read access, which have write/update access, and whether any documents are restricted."
    fills: "## Access Controls"
    maps_to: dct:accessRights
    required: true
    guidance: "Access controls protect confidential project information and ensure that records can be retrieved for audit purposes. If no restrictions apply, state 'Open to all authorised staff in the receiving organisation'."

  - id: retention_policy
    order: 4
    prompt: "How long must project records be retained? State the retention period, the legal or organisational policy basis, and the scheduled review or destruction date."
    fills: "## Retention Policy"
    maps_to: dct:description
    required: true
    guidance: "Retention periods are usually set by legal, regulatory, or organisational policy — not by the project. Confirm the applicable policy with the receiving organisation."

  - id: handover_confirmation
    order: 5
    prompt: "Confirm that the project archive has been transferred to the archive owner. State the name and role of the person who confirmed receipt, and the transfer date."
    fills: "## Handover Confirmation"
    maps_to: pm:approvedBy
    required: true
    guidance: "The archive is not complete until the archive owner confirms receipt. An unconfirmed handover risks the records being lost when the project team disbands."

# Completion rule: all required gates must be filled before the document
# is considered draft-complete. The agent MUST NOT mark the document complete
# if any required gate is empty or contains only a placeholder.
completion:
  required_gates:
    - archive_location
    - document_inventory
    - access_controls
    - retention_policy
    - handover_confirmation
  output_status: draft
  next_document: null
