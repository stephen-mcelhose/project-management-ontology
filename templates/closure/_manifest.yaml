# Phase manifest — Closure
#
# This is the single-read index for the Closure Phase.
# See ADR-003 for the manifest pattern and field definitions.
# Do not duplicate gate content from instructions.yaml here.

type: phase-manifest
phase: closure
phase_label: Closure
ontology_phase: https://stephen-mcelhose.github.io/project-management-ontology/phases/Closure
din_69901_part: DIN 69901-2:2009
standard: ISO 21502:2020
package: pkgs:ClosurePackage

# Document sequence — dependency order, phase-local numbering
documents:
  - id: handover-document
    phase_local_order: 1
    title: Handover Document
    ontology_class: pm:HandoverDocument
    path: templates/closure/handover-document/
    dependencies:
      - deliverable-status-report   # cross-phase: from Execution
    required_before:
      - final-project-report

  - id: final-project-report
    phase_local_order: 2
    title: Final Project Report
    ontology_class: pm:FinalProjectReport
    path: templates/closure/final-project-report/
    dependencies:
      - status-report               # cross-phase: from Monitoring & Control
      - handover-document           # closure phase: handover must be complete
    required_before:
      - archive-index
      - project-closure-statement

  - id: lessons-learned-report
    phase_local_order: 3
    title: Lessons Learned Report
    ontology_class: pm:LessonsLearnedReport
    path: templates/closure/lessons-learned-report/
    dependencies:
      - issue-log                   # cross-phase: from Monitoring & Control
      - risk-register               # cross-phase: from Monitoring & Control
    required_before: []

  - id: archive-index
    phase_local_order: 4
    title: Archive Index
    ontology_class: pm:ArchiveIndex
    path: templates/closure/archive-index/
    dependencies:
      - final-project-report
      # Note: all-documents dependency expressed narratively — the index implicitly
      # depends on all project documents being finalized before it can be compiled.
    required_before: []

  - id: project-closure-statement
    phase_local_order: 5
    title: Project Closure Statement
    ontology_class: pm:ProjectClosureStatement
    path: templates/closure/project-closure-statement/
    dependencies:
      - final-project-report
    required_before: []

# Shared context
shared_context:
  - field: project_name
    maps_to: dct:title
    first_captured_in: project-proposal   # cross-phase: captured in Initiation

# Phase completion
completion:
  required_documents:
    - handover-document
    - final-project-report
    - lessons-learned-report
    - archive-index
    - project-closure-statement
  output_status: draft
  next_phase: null              # Closure is the terminal phase
  first_document_in_next_phase: null
