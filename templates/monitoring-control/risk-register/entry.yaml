id: risk-register
title: Risk Register
phase: monitoring-control
phase_order: 2         # opened at initiation, maintained throughout; second in monitoring sequence

ontology_class: https://stephen-mcelhose.github.io/project-management-ontology/RiskRegister

# Grounding
standard:
  name: ISO 21502:2020 — Guidance on project management
  url: https://www.iso.org/standard/74947.html
prince2_equivalent:
  name: Risk Register
  url: https://prince2.wiki/management-products/project-log/risk-register/
package: pkgs:MonitoringControlPackage

# Dependency chain (pm:hasHardDependency)
dependencies:
  - risk-management-plan        # from document.ttl: :RiskRegister :hasHardDependency :RiskManagementPlan
required_before:
  - lessons-learned-report      # from document.ttl: :LessonsLearnedReport :hasHardDependency :RiskRegister

# Template files
template: template.md
instructions: instructions.yaml
shacl_shape: ../../../shapes/monitoring-control/risk-register.shacl.ttl
