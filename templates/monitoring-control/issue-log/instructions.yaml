# instructions.yaml — Issue Log
#
# Rules for an agent helping a project manager log an Issue Log entry.
# Each gate captures one field of a SINGLE ISSUE ENTRY.
# Gates are ordered: earlier gates must be resolved before later ones.
#
# PRINCE2 basis: Issue Register
#   Tracks formal issues: Requests for Change (RFC), Off-Specifications, and
#   Problems/Concerns. Informal issues (e.g. minor admin problems) belong
#   in the Daily Log, not here. Priority and severity scales are defined
#   in the Issue Management Approach.
#
# This is the INPUT side. The output is validated by:
#   shapes/monitoring-control/issue-log.shacl.ttl

version: 1
document: issue-log

gates:
  - id: entry_id
    order: 1
    type: identifier
    prompt: "What is the unique identifier for this issue? (e.g. ISS-001, ISS-002)"
    fills: "## Issue Entry"
    maps_to: dct:identifier
    required: true
    validation: "Must follow a consistent scheme (e.g. ISS-NNN). Never reuse an ID, even for closed issues."

  - id: issue_type
    order: 2
    type: string
    prompt: "What type of issue is this? Choose one: Request for Change (RFC) / Off-Specification / Problem or Concern."
    fills: "## Issue Type"
    maps_to: dct:description
    required: true
    validation: "Must be one of the three PRINCE2 issue types. 'Problem or Concern' covers informal problems that don't fit RFC or Off-Specification."

  - id: date_raised
    order: 3
    type: date
    prompt: "When was this issue raised? (YYYY-MM-DD)"
    fills: "## Date Raised"
    maps_to: dct:created
    required: true

  - id: raised_by
    order: 4
    type: prose
    prompt: "Who raised this issue? (Named individual or role)"
    fills: "## Raised By"
    maps_to: dct:creator
    required: true

  - id: issue_description
    order: 5
    type: prose
    prompt: "Describe the issue. What has happened, or what is the concern? Be specific about how it deviates from the agreed plan or Product Description."
    fills: "## Issue Description"
    maps_to: dct:description
    required: true
    validation: "For RFCs and Off-Specifications, reference the specific baseline document or Product Description affected."

  - id: priority
    order: 6
    type: prose
    prompt: "What is the priority of this issue? Use the scale defined in the Issue Management Approach (e.g. High / Medium / Low)."
    fills: "## Priority"
    maps_to: pm:priority
    required: true
    guidance: "Priority = urgency of decision. It is independent of severity."

  - id: severity
    order: 7
    type: prose
    prompt: "What is the severity of this issue? Use the scale defined in the Issue Management Approach (e.g. Critical / Major / Minor)."
    fills: "## Severity"
    maps_to: dct:description
    required: true
    guidance: "Severity = impact if left unresolved. A Low-priority issue can still be Critical severity if left alone long-term."

  - id: assigned_to
    order: 8
    type: prose
    prompt: "Who is assigned to investigate or resolve this issue? (Named individual)"
    fills: "## Assigned To"
    maps_to: pm:assignedRole
    required: false
    deferred_value: "*Unassigned.*"

  - id: issue_status
    order: 9
    type: string
    prompt: "What is the current status of this issue? (Open / In Progress / Resolved / Closed)"
    fills: "## Status"
    maps_to: pm:documentStatus
    required: true

  - id: resolution
    order: 10
    type: prose
    prompt: "How was this issue resolved? Describe the outcome and actions taken. Leave as TBD if still open."
    fills: "## Resolution"
    maps_to: dct:description
    required: false
    deferred_value: "*Pending.*"
    guidance: "Capture lessons from the resolution — each issue is an opportunity to improve future delivery."

  - id: closure_date
    order: 11
    type: date
    prompt: "When was this issue formally closed? (YYYY-MM-DD, or TBD if still open)"
    fills: "## Closure Date"
    maps_to: dct:description
    required: false
    deferred_value: "*To be confirmed.*"

# Completion rule: all required gates must be filled before the entry
# is considered draft-complete.
completion:
  required_gates:
    - entry_id
    - issue_type
    - date_raised
    - raised_by
    - issue_description
    - priority
    - severity
    - issue_status
  output_status: draft
  next_document: null
