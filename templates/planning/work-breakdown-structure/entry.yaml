# Dependency chain (pm:hasHardDependency)
dependencies:
  - project-charter          # must exist before the WBS can be produced
required_before:
  - project-schedule         # ProjectSchedule depends on WorkBreakdownStructure
  - work-package-description # WorkPackageDescription depends on WorkBreakdownStructure

# Template files
template: template.md
instructions: instructions.yaml
