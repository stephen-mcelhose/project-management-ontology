id: work-breakdown-structure
title: Work Breakdown Structure
phase: planning
phase_order: 2         # second planning document; decomposes scope into work packages

ontology_class: https://stephen-mcelhose.github.io/project-management-ontology/WorkBreakdownStructure

# Grounding
standard:
  name: ISO 21502:2020 — Guidance on project management
  url: https://www.iso.org/standard/74947.html
din_69901:
  phase: Planning
  part: DIN 69901-3:2009 (Projektstrukturplan / PSP)
  url: https://www.beuth.de/en/standard/din-69901-2/119948897
prince2_equivalent:
  name: Plan (product breakdown structure component)
  url: https://prince2.wiki/management-products/baselines/plan/
