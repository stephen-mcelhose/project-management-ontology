# instructions.yaml — Project Schedule
#
# Rules for an agent helping a user fill out the Project Schedule template.
# Each gate is a question or check the agent must complete before moving on.
# Gates are ordered: earlier gates must be resolved before later ones.
#
# This is the INPUT side. The output is validated by:
#   shapes/planning/project-schedule.shacl.ttl

version: 1
document: project-schedule

gates:
  - id: project_name
    order: 1
    type: string
    prompt: "What is the name of this project? (Must match the Project Charter and WBS.)"
    fills: "# Project Schedule: {{project_name}}"
    maps_to: dct:title
    required: true

  - id: schedule_description
    order: 2
    type: prose
    prompt: "Briefly describe the scope of this schedule. What work does it cover, and what scheduling method is used (e.g. Gantt chart, critical path method, product checklist)?"
    fills: "## Schedule Overview"
    maps_to: dct:description
    required: true

  - id: project_start_date
    order: 3
    type: date
    prompt: "What is the planned project start date? (Format: YYYY-MM-DD)"
    fills: "## Timeline"
    maps_to: pm:plannedStartDate
    required: true
    validation: "Must be a valid date in YYYY-MM-DD format."

  - id: project_end_date
    order: 4
    type: date
    prompt: "What is the planned project end date? (Format: YYYY-MM-DD)"
    fills: "## Timeline"
    maps_to: pm:plannedEndDate
    required: true
    validation: "Must be after the start date."

  - id: key_milestones
    order: 5
    type: table
    prompt: "What are the key project milestones? For each: milestone name, target date, and what deliverable or event triggers it."
    fills: "## Key Milestones"
    maps_to: pm:hasMilestone
    required: true
    validation: "At minimum, provide: project start, end of each major stage/phase, and project completion milestones."

  - id: activity_sequence
    order: 6
    type: section
    prompt: "List the scheduled activities, drawn from the WBS work packages. For each activity: ID, name, start date, end date, predecessor activities, and responsible role."
    fills: "## Activity Schedule"
    maps_to: pm:hasTask
    required: true
    guidance: "Group activities by deliverable or project stage. Reference WBS work package IDs where possible."

  - id: critical_path
    order: 7
    type: prose
    prompt: "Identify the critical path — the sequence of dependent activities that determines the earliest project completion date. Which activities have zero float?"
    fills: "## Critical Path"
    required: true
    guidance: "If using a tool (e.g. MS Project), attach or reference the output. Identify the top 3 risks to the critical path."

  - id: schedule_assumptions
    order: 8
    type: list
    prompt: "What assumptions underpin the schedule estimates? (e.g. resource availability, no holidays affecting team, external input received by specific dates.)"
    fills: "## Schedule Assumptions"
    maps_to: pm:hasAssumption
    required: true

  - id: schedule_tolerances
    order: 9
    type: prose
    prompt: "What is the agreed time tolerance for this schedule? (e.g. ±2 weeks per stage.) Beyond what deviation must the project board be informed?"
    fills: "## Schedule Tolerances"
    maps_to: pm:hasTolerance
    required: true

# Completion rule
completion:
  required_gates:
    - project_name
    - schedule_description
    - project_start_date
    - project_end_date
    - key_milestones
    - activity_sequence
    - critical_path
    - schedule_assumptions
    - schedule_tolerances
  output_status: draft
  next_document: resource-plan
