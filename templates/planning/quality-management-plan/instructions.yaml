# instructions.yaml — Quality Management Plan
#
# Rules for an agent helping a user fill out the Quality Management Plan template.
# Each gate is a question or check the agent must complete before moving on.
# Gates are ordered: earlier gates must be resolved before later ones.
#
# This is the INPUT side. The output is validated by:
#   shapes/planning/quality-management-plan.shacl.ttl

version: 1
document: quality-management-plan

gates:
  - id: project_name
    order: 1
    type: string
    prompt: "What is the name of this project? (Must match the Project Charter and Requirement Specification.)"
    fills: "# Quality Management Plan: {{project_name}}"
    maps_to: dct:title
    required: true

  - id: quality_scope
    order: 2
    type: prose
    prompt: "What is in scope for quality management on this project? Which products and activities are subject to quality control? Are any explicitly excluded?"
    fills: "## Scope"
    maps_to: dct:description
    required: true

  - id: quality_standards
    order: 3
    type: list
    prompt: "What quality standards apply to this project? List all applicable organizational, industry, legal, or regulatory standards. For each standard, note which deliverables it applies to."
    fills: "## Applicable Standards"
    maps_to: pm:qualityExpectations
    required: true
    validation: "Must reference at least one named quality standard. 'Good quality' or 'high standard' without a named standard is not acceptable."

  - id: quality_procedures
    order: 4
    type: prose
    prompt: "Describe the quality management procedures: (a) Quality Planning — how quality requirements are defined per deliverable, (b) Quality Control — how deliverables are inspected/tested, (c) Quality Assurance — how the process is audited."
    fills: "## Quality Management Procedures"
    required: true
    validation: "All three aspects (planning, control, assurance) must be addressed."

  - id: acceptance_criteria
    order: 5
    type: section
    prompt: "What are the acceptance criteria for the final project product and key deliverables? For each deliverable, state the specific measurable criteria it must meet to be accepted."
    fills: "## Acceptance Criteria"
    maps_to: pm:acceptanceCriteria
    required: true
    validation: "Acceptance criteria must be measurable. 'Meets user expectations' is not an acceptance criterion."

  - id: quality_roles
    order: 6
    type: section
    prompt: "Who is responsible for quality management activities? Define: Quality Manager or QA Lead (who assures the process), Reviewers (who perform quality checks on deliverables), Approvers (who sign off acceptance)."
    fills: "## Responsibilities"
    maps_to: pm:RoleAssignment
    required: true

  - id: quality_tools
    order: 7
    type: list
    prompt: "What tools and techniques will be used for quality control and assurance? (e.g. code reviews, peer reviews, testing frameworks, checklists, audits, walkthroughs.)"
    fills: "## Supporting Tools and Techniques"
    required: true

  - id: quality_records
    order: 8
    type: prose
    prompt: "How will quality records be maintained? Where will quality evidence (test results, review minutes, audit reports) be stored? How long will they be retained?"
    fills: "## Quality Records"
    required: true
    guidance: "Quality records feed the Quality Audit Report in the Execution phase. Ensure the storage location is agreed and accessible to reviewers."

# Completion rule
completion:
  required_gates:
    - project_name
    - quality_scope
    - quality_standards
    - quality_procedures
    - acceptance_criteria
    - quality_roles
    - quality_tools
    - quality_records
  output_status: draft
  next_document: communication-plan
