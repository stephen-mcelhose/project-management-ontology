id: quality-management-plan
title: Quality Management Plan
phase: planning
phase_order: 7         # establishes quality standards and assurance activities

ontology_class: https://stephen-mcelhose.github.io/project-management-ontology/QualityManagementPlan

# Grounding
standard:
  name: ISO 21502:2020 — Guidance on project management
  url: https://www.iso.org/standard/74947.html
prince2_equivalent:
  name: Quality Management Approach
  url: https://prince2.wiki/management-products/baselines/management-approaches/quality/
package: pkgs:PlanningPackage

# Dependency chain (pm:hasHardDependency)
dependencies:
  - requirement-specification # must exist before the QMP can be produced
required_before:
  - quality-audit-report      # QualityAuditReport depends on QualityManagementPlan

# Template files
template: template.md
instructions: instructions.yaml
shacl_shape: ../../../shapes/planning/quality-management-plan.shacl.ttl
