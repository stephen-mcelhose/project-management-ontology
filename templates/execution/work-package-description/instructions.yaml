# instructions.yaml — Work Package Description
#
# Rules for an agent helping a user fill out the Work Package Description template.
# Each gate is a question or check the agent must complete before moving on.
# Gates are ordered: earlier gates must be resolved before later ones.
#
# This is the INPUT side. The output is validated by:
#   shapes/execution/work-package-description.shacl.ttl

version: 1
document: work-package-description

gates:
  - id: work_package_title
    order: 1
    prompt: "What is the title of this Work Package? (Give it a concise, descriptive name — e.g. 'Backend API Integration', 'User Acceptance Testing Phase 1'.)"
    fills: "# Work Package Description: {{work_package_title}}"
    maps_to: dct:title
    required: true
    validation: "Must be a noun phrase that clearly identifies the body of work. Avoid generic names like 'Development Sprint'."

  - id: work_package_id
    order: 2
    prompt: "What is the unique identifier for this Work Package? (Must be traceable to the Work Breakdown Structure, e.g. WP-003.)"
    fills: "## Work Package Reference"
    maps_to: dct:identifier
    required: true
    validation: "Must follow the project's WBS identifier scheme and correspond to a real entry in the Work Breakdown Structure."

  - id: team_manager
    order: 3
    prompt: "Who is the Team Manager or individual team member assigned to deliver this Work Package? Provide their name and role."
    fills: "## Team Manager / Assigned Team"
    maps_to: pm:RoleAssignment
    required: true
    validation: "Must be a named person or team, not a generic role like 'Development Team'."

  - id: date_of_agreement
    order: 4
    prompt: "On what date was this Work Package formally agreed between the Project Manager and the Team Manager?"
    fills: "## Date of Agreement"
    maps_to: dct:created
    required: true
    validation: "Must be a specific date. If not yet agreed, leave as TBD but mark the gate incomplete."

  - id: work_description
    order: 5
    prompt: "Describe the work to be done in this Work Package. What tasks must the team complete? Be specific enough that the Team Manager can plan and start without further clarification."
    fills: "## Description of Work"
    maps_to: dct:description
    required: true
    validation: "Must describe actual tasks or activities, not just an outcome. Avoid vague language like 'complete the module'."

  - id: deliverables
    order: 6
    prompt: "What products or deliverables must this Work Package produce? For each, state: the deliverable name, its WBS/product ID, and a brief description of what 'done' looks like."
    fills: "## Deliverables"
    maps_to: pm:hasDeliverable
    required: true
    guidance: "Reference the Product Descriptions in the project's Quality Management Plan. Each deliverable must have an unambiguous completion criterion."

  - id: techniques_and_methods
    order: 7
    prompt: "What specific techniques, tools, or methods must be used during delivery? (e.g. 'Use Swagger for API documentation', 'Apply OWASP top-10 checklist for security review'.)"
    fills: "## Techniques and Methods"
    maps_to: pm:projectApproach
    required: false
    guidance: "List only constraints that the team must follow. If there are no mandatory methods, state 'No mandatory methods specified'."

  - id: quality_criteria
    order: 8
    prompt: "What quality criteria must each deliverable satisfy before it is accepted? For each deliverable listed, specify the acceptance criteria the reviewer will apply."
    fills: "## Quality Criteria and Acceptance"
    maps_to: pm:acceptanceCriteria
    required: true
    validation: "Criteria must be specific and testable. 'Good quality' is not acceptable — use measurable standards like 'zero critical defects', 'passes all test cases in test plan TP-001'."

  - id: tolerances
    order: 9
    prompt: "What are the agreed tolerances for this Work Package? State the permitted deviation for each applicable dimension: Time (e.g. ±2 days), Cost (e.g. ±5%), Scope (e.g. 'no new features without change request')."
    fills: "## Agreed Tolerances"
    maps_to: pm:hasTolerance
    required: true
    guidance: "At minimum, Time tolerance must be specified. If a tolerance is exceeded, the Team Manager must escalate immediately via the path defined below."

  - id: reporting_arrangements
    order: 10
    prompt: "What are the reporting arrangements for this Work Package? State: the frequency of Deliverable Status Reports (Checkpoint Reports), the format, and who receives them."
    fills: "## Reporting Arrangements"
    maps_to: dct:description
    required: true
    guidance: "Example: 'Weekly Deliverable Status Report submitted to the Project Manager every Friday by 17:00. Format: filled template.md stored in project SharePoint.'"

  - id: escalation_path
    order: 11
    prompt: "How should the team escalate issues or risks that exceed the agreed tolerances? Name the escalation contact and state the expected response time."
    fills: "## Escalation Path"
    maps_to: pm:hasRisk
    required: true
    validation: "Must name a specific person (not just a role). Must state what triggers escalation (tolerance breach) and the target response time."

  - id: interfaces
    order: 12
    prompt: "Who are the people, teams, or systems this Work Package must interface with? For each interface, state: who/what, why coordination is needed, and the communication channel."
    fills: "## Interfaces"
    maps_to: pm:RoleAssignment
    required: false
    guidance: "Identify any dependencies on other Work Packages or external teams. An empty interfaces section is a red flag for complex work — push the user to name at least one."

# Completion rule: all required gates must be filled before the document
# is considered draft-complete. The agent MUST NOT mark the document complete
# if any required gate is empty or contains only a placeholder.
completion:
  required_gates:
    - work_package_title
    - work_package_id
    - team_manager
    - date_of_agreement
    - work_description
    - deliverables
    - quality_criteria
    - tolerances
    - reporting_arrangements
    - escalation_path
  output_status: draft
  next_document: deliverable-status-report
