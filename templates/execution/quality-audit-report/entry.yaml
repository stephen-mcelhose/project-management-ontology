id: quality-audit-report
title: Quality Audit Report
phase: execution
phase_order: 4         # produced after each quality review activity during execution

ontology_class: https://stephen-mcelhose.github.io/project-management-ontology/QualityAuditReport

# Grounding
standard:
  name: ISO 21502:2020 — Guidance on project management
  url: https://www.iso.org/standard/74947.html
prince2_equivalent:
  name: Quality Register
  url: https://prince2.wiki/management-products/project-log/quality-register/
package: pkgs:ExecutionPackage

# Dependency chain (pm:hasHardDependency)
dependencies:
  - quality-management-plan     # quality criteria and review methods must be defined first
required_before: []             # no other document has a formal hard dependency on this one

# Template files
template: template.md
instructions: instructions.yaml
shacl_shape: ../../../shapes/execution/quality-audit-report.shacl.ttl
