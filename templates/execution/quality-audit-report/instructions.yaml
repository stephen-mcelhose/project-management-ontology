# instructions.yaml — Quality Audit Report
#
# Rules for an agent helping a user fill out the Quality Audit Report template.
# Each gate is a question or check the agent must complete before moving on.
# Gates are ordered: earlier gates must be resolved before later ones.
#
# This is the INPUT side. The output is validated by:
#   shapes/execution/quality-audit-report.shacl.ttl
#
# PRINCE2 basis: Quality Register (one entry per review activity)

version: 1
document: quality-audit-report

gates:
  - id: audit_id
    order: 1
    prompt: "What is the unique identifier for this Quality Audit Report? (e.g. QA-001. Must be traceable to the project's Quality Register.)"
    fills: "# Quality Audit Report: {{audit_id}}"
    maps_to: dct:identifier
    required: true
    validation: "Must be a unique identifier consistent with the Quality Register numbering scheme."

  - id: product_id_and_name
    order: 2
    prompt: "What is the ID and name of the product being quality-checked? Reference its entry in the Product Register / Work Breakdown Structure."
    fills: "## Product Reviewed"
    maps_to: pm:hasDeliverable
    required: true
    validation: "Product ID must correspond to a real deliverable in the project's Product Register."

  - id: quality_method
    order: 3
    prompt: "What quality control method was used for this review? (e.g. formal document review, structured walkthrough, software testing, physical inspection, quality workshop.)"
    fills: "## Quality Method"
    maps_to: pm:projectApproach
    required: true
    validation: "Must match a method defined in the Quality Management Plan for this product type."

  - id: producer
    order: 4
    prompt: "Who produced or developed the product being reviewed? Provide the name and role of the person or team responsible for creating this deliverable."
    fills: "## Producer"
    maps_to: pm:RoleAssignment
    required: true

  - id: reviewer
    order: 5
    prompt: "Who reviewed or tested the product? Provide the name and role of each reviewer. (There may be more than one.)"
    fills: "## Reviewer(s)"
    maps_to: pm:RoleAssignment
    required: true
    validation: "At minimum one named reviewer must be identified. The reviewer must be independent of the producer for formal quality reviews."

  - id: approver
    order: 6
    prompt: "Who is responsible for formally signing off and accepting this product? Provide the name and role of the approver."
    fills: "## Approver"
    maps_to: pm:RoleAssignment
    required: true
    validation: "Must be a named individual with authority to accept this product per the Quality Management Plan."

  - id: target_review_date
    order: 7
    prompt: "What was the planned date for the quality review of this product? (As scheduled in the project plan.)"
    fills: "## Target Review Date"
    maps_to: pm:plannedStartDate
    required: true

  - id: actual_review_date
    order: 8
    prompt: "What was the actual date the quality review took place?"
    fills: "## Actual Review Date"
    maps_to: dct:created
    required: true
    guidance: "If the review date differs from the target date, explain the variance in the Result section."

  - id: target_approval_date
    order: 9
    prompt: "What was the planned date for formal product approval?"
    fills: "## Target Approval Date"
    maps_to: pm:plannedEndDate
    required: true

  - id: actual_approval_date
    order: 10
    prompt: "What was the actual date the product was formally approved? Leave blank if approval is still pending."
    fills: "## Actual Approval Date"
    maps_to: pm:plannedEndDate
    required: false
    guidance: "If approval is pending, leave as TBD. If the product failed and requires rework, note that here."

  - id: quality_criteria
    order: 11
    prompt: "What quality criteria were applied in this review? List each criterion and its source (e.g. 'Zero critical defects — per Product Description PD-005, §3.2')."
    fills: "## Quality Criteria Applied"
    maps_to: pm:acceptanceCriteria
    required: true
    validation: "Each criterion must be traceable to a source document (Product Description, Quality Management Plan, or relevant standard). Vague criteria like 'good quality' are not acceptable."

  - id: result
    order: 12
    prompt: "What was the result of the quality review? State: Pass, Fail, or Conditional Pass. For Conditional Pass or Fail, summarise the specific defects or non-conformances found."
    fills: "## Result"
    maps_to: pm:deliverableStatus
    required: true
    validation: "Must be one of: Pass, Fail, or Conditional Pass. Conditional Pass means the product can proceed subject to specified corrective actions being completed and re-verified."

  - id: actions
    order: 13
    prompt: "If the result was Fail or Conditional Pass, what corrective actions are required? For each action: describe it, assign it to a named owner, and state the target completion date."
    fills: "## Corrective Actions"
    maps_to: dct:description
    required: false
    guidance: "If the result was Pass, state 'No corrective actions required.' Each Conditional Pass action must be verified before the product can be formally approved."

  - id: quality_records_link
    order: 14
    prompt: "Provide a link or reference to the quality records supporting this review (e.g. signed-off review forms, test results, acceptance certificates, or inspection checklists)."
    fills: "## Quality Records Reference"
    maps_to: dct:description
    required: true
    guidance: "Quality records must be stored in a retrievable location. Reference both the storage location and the document/file name. Without this link the audit trail is incomplete."

# Completion rule: all required gates must be filled before the document
# is considered draft-complete.
completion:
  required_gates:
    - audit_id
    - product_id_and_name
    - quality_method
    - producer
    - reviewer
    - approver
    - target_review_date
    - actual_review_date
    - target_approval_date
    - quality_criteria
    - result
    - quality_records_link
  output_status: draft
  next_document: null    # Quality Audit Reports are produced per product — no fixed next document
