# Phase manifest — Execution
#
# This is the single-read index for the Execution Phase.
# See ADR-003 for the manifest pattern and field definitions.
# Do not duplicate gate content from instructions.yaml here.

type: phase-manifest
phase: execution
phase_label: Execution
ontology_phase: https://stephen-mcelhose.github.io/project-management-ontology/phases/Execution
din_69901_part: DIN 69901-2:2009
standard: ISO 21502:2020
package: pkgs:ExecutionPackage

# Document sequence — dependency order, phase-local numbering
documents:
  - id: work-package-description
    phase_local_order: 1
    title: Work Package Description
    ontology_class: pm:WorkPackageDescription
    path: templates/execution/work-package-description/
    dependencies:
      - work-breakdown-structure    # cross-phase: from Planning
      - project-schedule            # cross-phase: from Planning
    required_before:
      - deliverable-status-report

  - id: deliverable-status-report
    phase_local_order: 2
    title: Deliverable Status Report
    ontology_class: pm:DeliverableStatusReport
    path: templates/execution/deliverable-status-report/
    dependencies:
      - work-package-description
    required_before: []

  - id: change-request
    phase_local_order: 3
    title: Change Request
    ontology_class: pm:ChangeRequest
    path: templates/execution/change-request/
    dependencies:
      - project-management-plan     # cross-phase: from Planning
    required_before:
      - change-log                  # cross-phase: in Monitoring & Control

  - id: quality-audit-report
    phase_local_order: 4
    title: Quality Audit Report
    ontology_class: pm:QualityAuditReport
    path: templates/execution/quality-audit-report/
    dependencies:
      - quality-management-plan     # cross-phase: from Planning
    required_before: []

# Shared context
shared_context:
  - field: project_name
    maps_to: dct:title
    first_captured_in: project-proposal   # cross-phase: captured in Initiation

# Phase completion
completion:
  required_documents:
    - work-package-description
    - deliverable-status-report
    - change-request
    - quality-audit-report
  output_status: draft
  next_phase: monitoring-control
  first_document_in_next_phase: status-report
