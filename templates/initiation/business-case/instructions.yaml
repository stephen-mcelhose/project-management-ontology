# instructions.yaml — Business Case
#
# Rules for an agent helping a user fill out the Business Case template.
# Each gate is a question or check the agent must complete before moving on.
# Gates are ordered: earlier gates must be resolved before later ones.
#
# Fields are sourced from the "Contents" section of the PRINCE2 Business Case
# management product: https://prince2.wiki/management-products/baselines/business-case/
#
# This is the INPUT side. The output is validated by:
#   shapes/initiation/business-case.shacl.ttl

version: 1
document: business-case

gates:
  - id: executive_summary
    order: 1
    prompt: "Write a short, reader-friendly executive summary: the key reasons for the project, the expected benefits, and the expected return on investment (ROI)."
    fills: "## Executive Summary"
    required: true
    validation: "Must be concise (a few sentences) and understandable without reading the rest of the document."

  - id: reasons
    order: 2
    prompt: "Why should this project proceed? Reference the justification from the Project Proposal / project mandate."
    fills: "## Reasons"
    maps_to: dct:description
    required: true
    validation: "Must state a business reason, not merely restate the problem statement verbatim."

  - id: business_options
    order: 3
    prompt: "What investment options were considered? PRINCE2 requires at least 'do nothing' as a baseline, plus 'do the minimum' and/or 'do more than the minimum'. For each option, note cost, benefit, feasibility, and viability."
    fills: "## Business Options"
    maps_to: pm:hasBusinessOption
    required: true
    validation: "Must include the 'do nothing' baseline option. Exactly one option must be marked as recommended."
    guidance: "Each option becomes a pm:BusinessOption instance; the chosen one sets pm:isRecommended true."

  - id: expected_benefits
    order: 4
    prompt: "List the expected benefits. For each: describe it, state how and when it will be measured, and name the benefit owner (usually the Senior User / project sponsor)."
    fills: "## Expected Benefits"
    maps_to: pm:hasBenefit
    required: true
    validation: "Each benefit must state a measure (pm:measure) — avoid unmeasurable claims like 'improves efficiency' with no metric."

  - id: expected_disbenefits
    order: 5
    prompt: "What negative outcomes might stakeholders experience as a result of this project (dis-benefits)? E.g. temporary productivity loss during a transition."
    fills: "## Expected Dis-benefits"
    maps_to: pm:hasDisbenefit
    required: false
    guidance: "It is acceptable to state 'none identified', but push the user to consider transition costs and disruption first."

  - id: timescale
    order: 6
    prompt: "What is the project timeline: start date, end date, and when will benefits begin to be realized (payback period)?"
    fills: "## Timescale"
    maps_to: pm:plannedEndDate
    required: true
    guidance: "Also record pm:plannedStartDate on the same pm:Project instance."

  - id: costs
    order: 7
    prompt: "What is the total estimated cost of the project, and what are the anticipated ongoing operational/maintenance costs after completion?"
    fills: "## Costs"
    maps_to: pm:budget
    required: true

  - id: investment_appraisal
    order: 8
    prompt: "Combine the cost and benefit information to demonstrate the project's overall value. Use a recognized technique appropriate to your organization (e.g. ROI, payback period, net present value)."
    fills: "## Investment Appraisal"
    maps_to: pm:investmentAppraisal
    required: true
    validation: "Must reference at least one named appraisal technique and its result, not just a cost/benefit restatement."

  - id: major_risks
    order: 9
    prompt: "Summarize the major risks to this business case (e.g. that assumptions on cost or benefit turn out to be wrong). Reference the full Risk Register once it exists."
    fills: "## Major Risks"
    maps_to: pm:Risk
    required: true

# Completion rule: all required gates must be filled before the document
# is considered draft-complete. The agent MUST NOT mark the document complete
# if any required gate is empty or contains only a placeholder.
completion:
  required_gates:
    - executive_summary
    - reasons
    - business_options
    - expected_benefits
    - timescale
    - costs
    - investment_appraisal
    - major_risks
  output_status: draft
  next_document: project-charter
