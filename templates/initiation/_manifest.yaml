# Phase manifest — Initiation
#
# This is the single-read index for the Initiation Phase.
# See ADR-003 for the manifest pattern and field definitions.
# Do not duplicate gate content from instructions.yaml here.

type: phase-manifest
phase: initiation
phase_label: Initiation
ontology_phase: https://stephen-mcelhose.github.io/project-management-ontology/phases/Initiation
din_69901_part: DIN 69901-2:2009
standard: ISO 21502:2020
package: pkgs:InitiationPackage

# Document sequence — dependency order, phase-local numbering
# phase_local_order is 1-based within this phase (independent of phase_order in entry.yaml)
documents:
  - id: project-proposal
    phase_local_order: 1
    title: Project Proposal
    ontology_class: pm:ProjectProposal
    path: templates/initiation/project-proposal/
    dependencies: []
    required_before:
      - business-case

  - id: business-case
    phase_local_order: 2
    title: Business Case
    ontology_class: pm:BusinessCase
    path: templates/initiation/business-case/
    dependencies:
      - project-proposal
    required_before:
      - project-charter

  - id: project-charter
    phase_local_order: 3
    title: Project Charter
    ontology_class: pm:ProjectCharter
    path: templates/initiation/project-charter/
    dependencies:
      - business-case
    required_before:
      - stakeholder-register

  - id: stakeholder-register
    phase_local_order: 4
    title: Stakeholder Register
    ontology_class: pm:StakeholderRegister
    path: templates/initiation/stakeholder-register/
    dependencies:
      - project-charter
    required_before:
      - requirement-specification

  - id: requirement-specification
    phase_local_order: 5
    title: Requirement Specification
    ontology_class: pm:RequirementSpecification
    path: templates/initiation/requirement-specification/
    dependencies:
      - stakeholder-register
    required_before: []  # last document in phase; next is in planning phase

# Shared context — fields captured once and carried across all documents in this phase.
# An agent MUST NOT re-ask for these after the first capture.
# Each field must match a real gate id in the named document's instructions.yaml.
shared_context:
  - field: project_name
    maps_to: dct:title
    first_captured_in: project-proposal

# Phase completion
# The phase is done when all required_documents have output_status: draft
# and have been reviewed by the project sponsor.
completion:
  required_documents:
    - project-proposal
    - business-case
    - project-charter
    - stakeholder-register
    - requirement-specification
  output_status: draft
  next_phase: planning
  first_document_in_next_phase: project-management-plan
